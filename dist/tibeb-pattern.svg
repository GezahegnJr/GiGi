<svg xmlns="http://www.w3.org/2000/svg" width="160" height="48" viewBox="0 0 160 48" fill="none">
  <!-- Top Trim: Gold & Ethiopian Flag Accent Rows -->
  <rect x="0" y="0" width="160" height="2" fill="#D4AF37"/>
  <rect x="0" y="2" width="160" height="2" fill="#1F854D"/>
  <rect x="0" y="4" width="160" height="2" fill="#E5A93B"/>
  <rect x="0" y="6" width="160" height="2" fill="#D9383A"/>
  <rect x="0" y="8" width="160" height="1" fill="#D4AF37"/>

  <!-- Background woven dark canvas band -->
  <rect x="0" y="9" width="160" height="30" fill="#0C0C0F"/>

  <!-- Geometric Chevron Weave Left -->
  <path d="M0 24 L10 14 L20 24 L10 34 Z" fill="#D4AF37" opacity="0.8"/>
  <path d="M4 24 L10 18 L16 24 L10 30 Z" fill="#D9383A"/>
  <circle cx="10" cy="24" r="2" fill="#F5D77F"/>

  <!-- Minor connecting diamond -->
  <polygon points="25,24 30,19 35,24 30,29" fill="#1F854D"/>
  <circle cx="30" cy="24" r="1.5" fill="#D4AF37"/>

  <!-- Interlocking Stepped Cross (Meskel Tibeb) - Unit 1 Center (x=50) -->
  <!-- Outer Cross Outline -->
  <path d="M44 19 H56 V21 H52 V27 H56 V29 H44 V27 H48 V21 H44 Z" fill="#D4AF37"/>
  <!-- Central Diamond Inset -->
  <polygon points="50,15 60,24 50,33 40,24" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="50,18 56,24 50,30 44,24" fill="#D9383A"/>
  <polygon points="50,20 54,24 50,28 46,24" fill="#E5A93B"/>
  <circle cx="50" cy="24" r="2" fill="#1F854D"/>

  <!-- Minor connecting diamond -->
  <polygon points="65,24 70,19 75,24 70,29" fill="#1F854D"/>
  <circle cx="70" cy="24" r="1.5" fill="#D4AF37"/>

  <!-- Stepped Chevron & Diamond Weave - Unit 2 (x=90) -->
  <path d="M80 24 L90 14 L100 24 L90 34 Z" fill="#D4AF37" opacity="0.85"/>
  <path d="M84 24 L90 18 L96 24 L90 30 Z" fill="#1F854D"/>
  <polygon points="90,21 93,24 90,27 87,24" fill="#E5A93B"/>

  <!-- Minor connecting diamond -->
  <polygon points="105,24 110,19 115,24 110,29" fill="#D9383A"/>
  <circle cx="110" cy="24" r="1.5" fill="#D4AF37"/>

  <!-- Second Major Meskel Tibeb Unit (x=130) -->
  <path d="M124 19 H136 V21 H132 V27 H136 V29 H124 V27 H128 V21 H124 Z" fill="#D4AF37"/>
  <polygon points="130,15 140,24 130,33 120,24" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="130,18 136,24 130,30 124,24" fill="#1F854D"/>
  <polygon points="130,20 134,24 130,28 126,24" fill="#E5A93B"/>
  <circle cx="130" cy="24" r="2" fill="#D9383A"/>

  <!-- Minor connecting diamond -->
  <polygon points="145,24 150,19 155,24 150,29" fill="#1F854D"/>
  <circle cx="150" cy="24" r="1.5" fill="#D4AF37"/>

  <!-- Zig-zag stitch lines along borders -->
  <path d="M0 12 L5 9 L10 12 L15 9 L20 12 L25 9 L30 12 L35 9 L40 12 L45 9 L50 12 L55 9 L60 12 L65 9 L70 12 L75 9 L80 12 L85 9 L90 12 L95 9 L100 12 L105 9 L110 12 L115 9 L120 12 L125 9 L130 12 L135 9 L140 12 L145 9 L150 12 L155 9 L160 12" stroke="#D4AF37" stroke-width="0.75" opacity="0.6" fill="none"/>
  
  <path d="M0 36 L5 39 L10 36 L15 39 L20 36 L25 39 L30 36 L35 39 L40 36 L45 39 L50 36 L55 39 L60 36 L65 39 L70 36 L75 39 L80 36 L85 39 L90 36 L95 39 L100 36 L105 39 L110 36 L115 39 L120 36 L125 39 L130 36 L135 39 L140 36 L145 39 L150 36 L155 39 L160 36" stroke="#D4AF37" stroke-width="0.75" opacity="0.6" fill="none"/>

  <!-- Bottom Trim: Ethiopian Flag Accent Rows & Gold -->
  <rect x="0" y="39" width="160" height="1" fill="#D4AF37"/>
  <rect x="0" y="40" width="160" height="2" fill="#D9383A"/>
  <rect x="0" y="42" width="160" height="2" fill="#E5A93B"/>
  <rect x="0" y="44" width="160" height="2" fill="#1F854D"/>
  <rect x="0" y="46" width="160" height="2" fill="#D4AF37"/>
</svg>
